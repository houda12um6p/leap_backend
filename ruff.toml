target-version = "py312"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in default arguments (FastAPI Depends)
    "UP042", # use StrEnum — keep explicit (str, Enum) for SQLAlchemy compatibility
    "E712",  # == False in SQLAlchemy filter expressions is intentional
]

[lint.isort]
known-first-party = ["app"]
